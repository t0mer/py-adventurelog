[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-adventurelog"
version = "0.1.0"
description = "Async Python SDK for AdventureLog"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adventurelog"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires live server credentials"]
testpaths = ["tests"]
